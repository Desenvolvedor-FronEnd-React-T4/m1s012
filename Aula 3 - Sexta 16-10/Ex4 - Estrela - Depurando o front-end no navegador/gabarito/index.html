<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolão da Copa — total de gols</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: .8rem; }
    input { width: 100%; padding: .4rem; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    #resultado { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Bolão da Copa</h1>
  <form id="form-palpite">
    <label for="gols-brasil">Gols do Brasil</label>
    <input type="number" id="gols-brasil" min="0" value="2">
    <label for="gols-rival">Gols do adversário</label>
    <input type="number" id="gols-rival" min="0" value="3">
    <button type="submit">Calcular total de gols</button>
  </form>
  <p id="resultado" role="status"></p>
  <script src="script.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 980" width="920" style="max-width:920px;background:#fff;border:1px solid #cfd8dc;border-radius:6px"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs><rect x="170.0" y="10.0" width="320" height="40" rx="20.0" fill="#1b4f72"/><text x="330" y="34.333333333333336" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff" font-weight="bold"><tspan x="330" dy="0">INÍCIO: abrir o terminal (cmd ou Git Bash)</tspan></text><rect x="180.0" y="75.0" width="300" height="50" rx="6" fill="#fff" stroke="#1b4f72" stroke-width="2"/><text x="330" y="96.33333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="330" dy="0">Digite:</tspan><tspan x="330" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">node --version   e   npm --version</tspan></text><path d="M330,50 L330,75" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><polygon points="330,160.0 475.0,210 330,260.0 185.0,210" fill="#fff8e1" stroke="#e08e00" stroke-width="2"/><text x="330" y="206.41666666666666" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5d4300" font-weight="bold"><tspan x="330" dy="0">Apareceu um número</tspan><tspan x="330" dy="15.5">de versão nos dois?</tspan></text><path d="M330,125 L330,160" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><path d="M475,210 L580,210" fill="none" stroke="#d9534f" stroke-width="2" marker-end="url(#a)"/><text x="498" y="200" font-family="Arial" font-size="12" font-weight="bold" fill="#d9534f">NÃO</text><rect x="580.0" y="168.0" width="260" height="84" rx="6" fill="#fdecea" stroke="#d9534f" stroke-width="2"/><text x="710" y="198.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="710" dy="0">INSTALAR EM 1 PASSO (Windows):</tspan><tspan x="710" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">winget install OpenJS.NodeJS.LTS</tspan><tspan x="710" dy="16">(aceite o pedido de permissão)</tspan></text><path d="M710,252 L710,282" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><rect x="580.0" y="282.0" width="260" height="56" rx="6" fill="#fff" stroke="#d9534f" stroke-width="2"/><text x="710" y="306.3333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="710" dy="0">Feche TODOS os terminais</tspan><tspan x="710" dy="16">e abra um novo (atualiza o PATH)</tspan></text><path d="M840,310 L885,310 L885,100 L480,100" fill="none" stroke="#d9534f" stroke-width="2" marker-end="url(#a)"/><text x="790" y="92" font-family="Arial" font-size="12" font-weight="bold" fill="#d9534f">volta a conferir</text><path d="M330,260 L330,355" fill="none" stroke="#2a9d8f" stroke-width="2" marker-end="url(#a)"/><text x="338" y="300" font-family="Arial" font-size="12" font-weight="bold" fill="#2a9d8f">SIM</text><polygon points="330,355.0 480.0,410 330,465.0 180.0,410" fill="#fff8e1" stroke="#e08e00" stroke-width="2"/><text x="330" y="406.4166666666667" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5d4300" font-weight="bold"><tspan x="330" dy="0">O Node é o LTS atual</tspan><tspan x="330" dy="15.5">(v24.x ou mais novo)?</tspan></text><path d="M480,410 L580,410" fill="none" stroke="#d9534f" stroke-width="2" marker-end="url(#a)"/><text x="495" y="400" font-family="Arial" font-size="12" font-weight="bold" fill="#d9534f">NÃO</text><rect x="580.0" y="388.0" width="260" height="84" rx="6" fill="#fdecea" stroke="#d9534f" stroke-width="2"/><text x="710" y="418.3333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="710" dy="0">ATUALIZAR EM 1 PASSO:</tspan><tspan x="710" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">winget upgrade OpenJS.NodeJS.LTS</tspan><tspan x="710" dy="16">(depois, reabra o terminal)</tspan></text><path d="M710,388 L710,338" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><path d="M330,465 L330,520" fill="none" stroke="#2a9d8f" stroke-width="2" marker-end="url(#a)"/><text x="338" y="500" font-family="Arial" font-size="12" font-weight="bold" fill="#2a9d8f">SIM</text><rect x="160.0" y="520.0" width="340" height="50" rx="6" fill="#fff" stroke="#1b4f72" stroke-width="2"/><text x="330" y="541.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="330" dy="0">Deixar o npm também na versão mais atual:</tspan><tspan x="330" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">npm install -g npm@latest</tspan></text><path d="M330,570 L330,605" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><rect x="180.0" y="605.0" width="300" height="50" rx="6" fill="#fff" stroke="#1b4f72" stroke-width="2"/><text x="330" y="626.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="330" dy="0">Conferir de novo:</tspan><tspan x="330" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">node --version   npm --version</tspan></text><path d="M330,655 L330,690" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><polygon points="330,690.0 485.0,745 330,800.0 175.0,745" fill="#fff8e1" stroke="#e08e00" stroke-width="2"/><text x="330" y="741.4166666666666" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5d4300" font-weight="bold"><tspan x="330" dy="0">O PowerShell mostrou</tspan><tspan x="330" dy="15.5">"running scripts is disabled"?</tspan></text><path d="M485,745 L580,745" fill="none" stroke="#d9534f" stroke-width="2" marker-end="url(#a)"/><text x="498" y="735" font-family="Arial" font-size="12" font-weight="bold" fill="#d9534f">SIM</text><rect x="580.0" y="690.0" width="260" height="110" rx="6" fill="#fff8e1" stroke="#e08e00" stroke-width="2"/><text x="710" y="717.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="710" dy="0">Use o Prompt de Comando</tspan><tspan x="710" dy="16">ou o Git Bash no VS Code</tspan><tspan x="710" dy="16">ou rode UMA vez:</tspan><tspan x="710" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">Set-ExecutionPolicy -Scope CurrentUser</tspan><tspan x="710" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">-ExecutionPolicy RemoteSigned</tspan></text><path d="M330,800 L330,880" fill="none" stroke="#2a9d8f" stroke-width="2" marker-end="url(#a)"/><text x="338" y="845" font-family="Arial" font-size="12" font-weight="bold" fill="#2a9d8f">NÃO</text><path d="M710,800 L710,905 L500,905" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><rect x="160.0" y="883.0" width="340" height="44" rx="22.0" fill="#2a9d8f"/><text x="330" y="909.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff" font-weight="bold"><tspan x="330" dy="0">PRONTO ✅  Node e npm atualizados</tspan></text><text x="330" y="964.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#455a64" ><tspan x="330" dy="0">O npm já vem com o Node; `npm install -g npm@latest` só o deixa na versão mais nova.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860" width="920" style="max-width:920px;background:#fff;border:1px solid #cfd8dc;border-radius:6px"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs><rect x="280.0" y="10.0" width="360" height="40" rx="20.0" fill="#1b4f72"/><text x="460" y="34.333333333333336" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff" font-weight="bold"><tspan x="460" dy="0">INÍCIO: não posso mudar a versão do Node</tspan></text><rect x="310.0" y="77.0" width="300" height="46" rx="6" fill="#fff" stroke="#1b4f72" stroke-width="2"/><text x="460" y="96.33333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="460" dy="0">Digite:</tspan><tspan x="460" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">node --version</tspan></text><path d="M460,50 L460,77" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><polygon points="460,150.0 625.0,200 460,250.0 295.0,200" fill="#fff8e1" stroke="#e08e00" stroke-width="2"/><text x="460" y="204.16666666666666" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#5d4300" font-weight="bold"><tspan x="460" dy="0">Qual é a versão?</tspan></text><path d="M460,123 L460,150" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><path d="M295,200 L150,200 L150,270" fill="none" stroke="#2a9d8f" stroke-width="2" marker-end="url(#a)"/><text x="30" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#2a9d8f">22.12 ou mais novo</text><path d="M460,250 L460,270" fill="none" stroke="#e08e00" stroke-width="2" marker-end="url(#a)"/><text x="468" y="262" font-family="Arial" font-size="12" font-weight="bold" fill="#e08e00">20.17 a 22.11</text><path d="M625,200 L770,200 L770,270" fill="none" stroke="#d9534f" stroke-width="2" marker-end="url(#a)"/><text x="700" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#d9534f">abaixo de 20.17</text><rect x="25.0" y="270.0" width="250" height="140" rx="6" fill="#eef7f2" stroke="#2a9d8f" stroke-width="2"/><text x="150" y="312.3333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="150" dy="0">Siga a aula como está.</tspan><tspan x="150" dy="16"></tspan><tspan x="150" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">npm install chalk@latest</tspan><tspan x="150" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">node index.js</tspan><tspan x="150" dy="16">→ TypeError ... (reading 'yellow')</tspan></text><rect x="310.0" y="270.0" width="300" height="170" rx="6" fill="#fff8e1" stroke="#e08e00" stroke-width="2"/><text x="460" y="311.3333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="460" dy="0">Dá para ver o MESMO erro dos alunos:</tspan><tspan x="460" dy="16"></tspan><tspan x="460" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">node --experimental-require-module index.js</tspan><tspan x="460" dy="16">→ TypeError ... (reading 'yellow')</tspan><tspan x="460" dy="16"></tspan><tspan x="460" dy="16">Sem a opção: ERR_REQUIRE_ESM</tspan><tspan x="460" dy="16">(mesma causa)</tspan></text><rect x="645.0" y="270.0" width="250" height="140" rx="6" fill="#fdecea" stroke="#d9534f" stroke-width="2"/><text x="770" y="312.3333333333333" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="770" dy="0">A opção acima não existe.</tspan><tspan x="770" dy="16">O erro será sempre</tspan><tspan x="770" dy="16">ERR_REQUIRE_ESM (mesma causa:</tspan><tspan x="770" dy="16">o chalk novo é ESM).</tspan><tspan x="770" dy="16">Considere atualizar o Node.</tspan></text><path d="M150,410 L150,500 L360,500" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><path d="M460,440 L460,500" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><path d="M770,410 L770,500 L560,500" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><rect x="200.0" y="500.0" width="520" height="90" rx="6" fill="#fff" stroke="#1b4f72" stroke-width="2"/><text x="460" y="533.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="460" dy="0">Para NÃO aparecer o aviso EBADENGINE (o chalk 6 pede Node 22+):</tspan><tspan x="460" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">npm install chalk@5</tspan><tspan x="460" dy="16">O chalk 5 também é ESM: a lição é exatamente a mesma e roda no Node 20.</tspan></text><path d="M460,590 L460,640" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><rect x="200.0" y="645.0" width="520" height="70" rx="6" fill="#eef7f2" stroke="#2a9d8f" stroke-width="2"/><text x="460" y="676.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#263238" ><tspan x="460" dy="0">Todo o resto da semana funciona igual:</tspan><tspan x="460" dy="16" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="bold" fill="#123049">npm install    npm start    "type": "module"    debugger</tspan></text><path d="M460,715 L460,755" fill="none" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/><rect x="280.0" y="763.0" width="360" height="44" rx="22.0" fill="#2a9d8f"/><text x="460" y="789.3333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff" font-weight="bold"><tspan x="460" dy="0">PRONTO ✅  sem trocar a versão instalada</tspan></text></svg>